# Local development stack. The deployed build is the root Dockerfile, which
# serves the built frontend from FastAPI as a single container.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omniagent-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=omniagent
      - POSTGRES_PASSWORD=omniagent
      - POSTGRES_DB=omniagent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniagent"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  legal-assistant-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-assistant-backend
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PROJECT_NAME=OmniAgent Legal Assistant OS
      - ENGINE_NAME=Aegis Agentic Core
      # Leave LLM_PROVIDER unset to let the app pick whichever key is present.
      # Pass a key through from your shell to enable the LLM path; without one
      # the assistant runs retrieval-only.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Case bank statistics live in Postgres so they survive a container rebuild.
      - DATABASE_URL=postgresql://omniagent:omniagent@postgres:5432/omniagent
      - VECTOR_STORE_PROVIDER=memory
      - EMBEDDING_PROVIDER=hash
      - VECTOR_DIMENSION=384
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  legal-assistant-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legal-assistant-frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - legal-assistant-backend


volumes:
  postgres_data:
